name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Restore Fixed Debug Keystore
        run: |
          mkdir -p ~/.android
          echo "MAAASAAAAAIAAAACAAAAAQALYW5kcm9pZGRlYnVna2V5AAAAAV9aZ1YAAAAABTCC
          A1E3TTA1BgNVBAMTLkFuZHJvaWQgRGVidWcsTz1BbmRyb2lkLEM9VVMAE2FuZHJv
          aWQxMjM0NTY3ODkwMDAwMTE1MDAwMTAwMDAwMDAwMDAwMDAwMDAwMDAwMDBaMHkx
          CzAJBgNVBAYTAlVTMRAwDgYDVQQKEwdBbmRyb2lkMRYwFAYDVQQLEw1BbmRyb2lk
          IERlYnVnMR0wGwYDVQQDExRBbmRyb2lkIERlYnVnIEtleXN0b3JlMIIBIjANBgkq
          hkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAuW" | base64 -d > ~/.android/debug.keystore || true
          
          if [ ! -s ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Install Dependencies
        run: npm install

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp index.html app.js manifest.json icon-*.png www/ 2>/dev/null || true

      - name: Add Android & Sync Capacitor
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # Публикуем прямое скачивание APK в GitHub Releases
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: latest
          name: "Автоматическая сборка"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
